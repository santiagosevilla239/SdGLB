<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Entrar · Los Bambinos</title>
  <link rel="icon" href="data:,">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <style>    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg-surface);
      padding: var(--space-5);
    }

    .login-card {
      width: 100%;
      max-width: 880px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      min-height: 440px;
    }

    .login-brand {
      background: var(--bg-canvas);
      padding: var(--space-6);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--border-subtle);
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-xs);
      color: var(--text-tertiary);
      font-weight: 500;
    }

    .brand-mark-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--brand);
      flex-shrink: 0;
    }

    .brand-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: var(--space-6) 0;
    }

    .brand-tagline {
      border-left: 3px solid var(--brand);
      padding-left: var(--space-3);
      font-style: italic;
      color: var(--text-secondary);
      font-size: var(--text-xs);
      line-height: var(--leading-relaxed);
    }

    .login-form-area {
      background: var(--bg-elevated);
      padding: var(--space-6);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-form-area h1 {
      font-size: var(--text-xl);
      font-weight: 500;
      margin-bottom: var(--space-1);
      line-height: var(--leading-tight);
    }

    .login-form-area > p {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin-bottom: var(--space-5);
    }

    .login-foot {
      text-align: center;
      margin-top: var(--space-4);
      padding-top: var(--space-4);
      border-top: 1px solid var(--border-subtle);
      font-size: var(--text-xs);
      color: var(--text-secondary);
    }

    @media (max-width: 720px) {
      .login-card {
        grid-template-columns: 1fr;
      }

      .login-brand {
        min-height: 200px;
        border-right: 0;
        border-bottom: 1px solid var(--border-subtle);
      }
    }
</style>
</head>
<body>

  <main class="login-shell">
    <div class="login-card">

      <div class="login-brand">

        <div class="brand-mark">
          <span class="brand-mark-dot" aria-hidden="true"></span>
          Los Bambinos · Sistema interno
        </div>

        <div class="brand-logo-wrap">
          <img
            src="assets/logo.svg"
            alt="Los Bambinos"
            width="220"
            height="83"
          >
        </div>

        <p class="brand-tagline">
          Inventario que se mide solo.<br>
          Pedidos que no mienten.
        </p>

      </div>

      <div class="login-form-area">

        <h1>Hola de nuevo</h1>
        <p>Ingresá con tu usuario y contraseña para seguir trabajando.</p>

        <div
          class="alert alert--error"
          id="login-error"
          role="alert"
          aria-live="assertive"
          hidden
        >
          <i class="ti ti-alert-circle" aria-hidden="true"></i>
          <span id="login-error-text"></span>
        </div>

        <form
          id="login-form"
          action="01-dashboard.html"
          method="get"
          novalidate
        >

          <div class="field-group">
            <label class="field-label" for="usr">Usuario</label>
            <input
              class="field-input"
              type="text"
              id="usr"
              name="usuario"
              autocomplete="username"
              placeholder="Por ejemplo: nicolas.p"
              aria-describedby="usr-help"
            >
          </div>

          <div class="field-group">
            <label class="field-label" for="pwd">Contraseña</label>
            <div class="field-input-wrapper">
              <input
                class="field-input field-input--with-toggle"
                type="password"
                id="pwd"
                name="contrasena"
                autocomplete="current-password"
                placeholder="La que te dieron al empezar"
                aria-describedby="pwd-help"
              >
              <button
                type="button"
                class="field-toggle"
                id="pwd-toggle"
                aria-label="Mostrar contraseña"
                aria-controls="pwd"
              >
                <i class="ti ti-eye" aria-hidden="true"></i>
              </button>
            </div>
            <p class="field-help" id="pwd-help">
              Si no la recordás, pedile a tu encargado que la blanquee.
            </p>
          </div>

          <div class="field-group">
            <label class="check-field">
              <input type="checkbox" name="recordar" id="recordar">
              Mantenerme conectado en esta computadora
            </label>
          </div>

          <button
            type="submit"
            class="btn btn--primary btn--block btn--lg"
            id="btn-submit"
          >
            <i class="ti ti-login-2" aria-hidden="true"></i>
            Entrar al sistema
          </button>

        </form>

        <p class="login-foot">
          ¿Problemas para entrar? <a href="#">Avisale al administrador</a>
        </p>

      </div>

    </div>
  </main>

  <script src="js/dialogo.js">
</script>
  <script src="js/login-form.js">
</script>
  <script src="js/nav-movil.js">
</script>
</body>
</html>
